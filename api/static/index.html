<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respite: Phoenix overnight recovery gap</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{
    --ink:#0e2129; --muted:#64808c; --hairline:#cfdde3; --panel:#f8fbfc; --ground:#e8eef1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;background:var(--ground)}
  .panel{
    position:absolute;top:1rem;left:1rem;z-index:2;width:min(21rem,calc(100vw - 2rem));
    background:var(--panel);border:1px solid var(--hairline);border-radius:.5rem;
    padding:1rem 1.15rem;box-shadow:0 .5rem 1.5rem rgba(14,33,41,.12);
  }
  h1{margin:0 0 .15rem;font-size:1.05rem;letter-spacing:-.01em}
  .sub{margin:0 0 .85rem;font-size:.8rem;color:var(--muted);font-style:italic}
  .stat{display:flex;justify-content:space-between;gap:1rem;font-size:.82rem;padding:.2rem 0}
  .stat b{font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:.35rem;margin:0 0 .8rem}
  .tab{flex:1;font:inherit;font-size:.72rem;padding:.4rem .3rem;cursor:pointer;
       border:1px solid var(--hairline);background:#fff;color:var(--muted);border-radius:.3rem}
  .tab.on{background:#0e2129;color:#fff;border-color:#0e2129}
  .legend{margin-top:.85rem;padding-top:.75rem;border-top:1px solid var(--hairline)}
  .legend .row{display:flex;align-items:center;gap:.5rem;font-size:.75rem;padding:.12rem 0}
  .sw{width:1.1rem;height:.65rem;border-radius:2px;flex:none}
  .note{margin-top:.75rem;font-size:.7rem;color:var(--muted);line-height:1.5}
  .warn{margin-top:.5rem;font-size:.7rem;color:#bd4a1a}
  .qrow{display:flex;gap:.35rem;margin:.2rem 0 .6rem}
  #q{flex:1;min-width:0;font:inherit;font-size:.78rem;padding:.4rem .5rem;
     border:1px solid var(--hairline);border-radius:.3rem}
  #ask{font:inherit;font-size:.75rem;padding:.4rem .7rem;cursor:pointer;
       background:#0e2129;color:#fff;border:none;border-radius:.3rem}
  #ask[disabled]{opacity:.5;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.55rem}
  .chip{font:inherit;font-size:.66rem;padding:.2rem .45rem;cursor:pointer;color:var(--muted);
        background:#fff;border:1px solid var(--hairline);border-radius:.9rem;text-align:left}
  .answer{font-size:.8rem;line-height:1.55;white-space:pre-wrap;max-height:15rem;overflow-y:auto}
  .trail{margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--hairline);
         font-family:ui-monospace,Consolas,monospace;font-size:.66rem;color:var(--muted);
         max-height:8rem;overflow-y:auto}
  .trail b{color:var(--ink);font-weight:600}
  .maplibregl-popup-content{font-size:.8rem;padding:.6rem .75rem;border-radius:.4rem}
  .maplibregl-popup-content b{display:block;margin-bottom:.2rem}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Respite</h1>
  <p class="sub">Which blocks never cool down</p>
  <div class="tabs">
    <button class="tab on" data-view="exposure">Exposure</button>
    <button class="tab" data-view="divergence">What the index misses</button>
    <button class="tab" data-view="agent">Ask</button>
  </div>
  <div id="stats"><div class="stat"><span>loading…</span></div></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="note"></p>
  <p class="warn" id="warn" hidden></p>

  <div id="agentbox" hidden>
    <div class="qrow">
      <input id="q" type="text" placeholder="Ask about the study area">
      <button id="ask">Ask</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="answer" class="answer"></div>
    <div id="trail" class="trail" hidden></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const BINS = [
  { max: 3.2, color: '#1a5b8a', label: 'under 3.2 h, real relief' },
  { max: 4.0, color: '#4a9ec4', label: '3.2 – 4.0 h' },
  { max: 4.7, color: '#f0d97d', label: '4.0 – 4.7 h' },
  { max: 5.4, color: '#e08a3c', label: '4.7 – 5.4 h' },
  { max: 99,  color: '#bd4a1a', label: 'over 5.4 h, almost no relief' },
];

function colorExpr() {
  const e = ['step', ['get', 'value'], BINS[0].color];
  for (let i = 0; i < BINS.length - 1; i++) e.push(BINS[i].max, BINS[i + 1].color);
  return e;
}

// Exposure and vulnerability are uncorrelated here (r = 0.004), so the second
// view deliberately does not blend them into one score -- it shows where they
// disagree, because the disagreement is the finding.
const QUADS = [
  ['blind_spot',    '#bd4a1a', 'Severe heat, outside the targeted band'],
  ['confirmed',     '#e8a33c', 'Severe heat, inside the targeted band'],
  ['over_targeted', '#7fa8bd', 'Targeted, but the night is survivable'],
  ['low_priority',  '#dfe7ea', 'Neither'],
  ['unknown',       '#b8bfc4', 'Vulnerability suppressed'],
];

function quadExpr() {
  const e = ['match', ['get', 'quadrant']];
  for (const q of QUADS) { e.push(q[0], q[1]); }
  e.push('#dfe7ea');
  return e;
}

let VIEW = 'exposure';

function renderLegend() {
  const rows = VIEW === 'exposure'
    ? BINS.map(b => [b.color, b.label])
    : QUADS.map(q => [q[1], q[2]]);
  document.getElementById('legend').innerHTML = rows.map(r =>
    '<div class="row"><span class="sw" style="background:' + r[0] + '"></span>' + r[1] + '</div>'
  ).join('');
}

function applyView() {
  const isAgent = VIEW === 'agent';
  if (map.getLayer('fill')) {
    // The agent view keeps the divergence colouring, since that is what it talks about.
    map.setPaintProperty('fill', 'fill-color',
      VIEW === 'exposure' ? colorExpr() : quadExpr());
    map.setPaintProperty('fill', 'fill-opacity', VIEW === 'exposure' ? 0.8 : 0.85);
  }
  document.getElementById('agentbox').hidden = !isAgent;
  document.getElementById('legend').hidden = isAgent;
  document.getElementById('note').hidden = isAgent;
  renderLegend();
  renderStats();
}

function warn(msg) {
  const el = document.getElementById('warn');
  el.hidden = false;
  el.textContent = msg;
}

// ---- 1. Panel first. It must never depend on the map or on any third party. ----
let SUMMARY = null, DIVERGENCE = null;

function renderStats() {
  const el = document.getElementById('stats');
  const note = document.getElementById('note');
  if (VIEW === 'exposure') {
    if (!SUMMARY) { el.innerHTML = '<div class="stat"><span>unavailable</span></div>'; return; }
    el.innerHTML =
      '<div class="stat"><span>Tracts</span><b>' + SUMMARY.tracts + '</b></div>' +
      '<div class="stat"><span><b>No relief all night</b></span><b>' + SUMMARY.tracts_with_no_relief + ' tracts</b></div>' +
      '<div class="stat"><span>Best relief</span><b>' + SUMMARY.max_relief_hours + ' h of ' + SUMMARY.window_hours + '</b></div>' +
      '<div class="stat"><span>Spread</span><b>' + SUMMARY.spread_hours + ' h</b></div>';
    note.textContent = 'Hours above ' + SUMMARY.threshold_c + ' \u00b0C during ' + SUMMARY.night_window +
      ', Phoenix, 15 Aug 2026. Area-weighted from 47,944 tiles at 100 m onto ' + SUMMARY.tracts + ' census tracts.';
  } else if (VIEW === 'agent') {
    el.innerHTML =
      '<div class="stat"><span>Agent reads</span><b>5 measurement tools</b></div>' +
      '<div class="stat"><span>Before recommending</span><b>checks stated limits</b></div>';
    return;
  } else {
    if (!DIVERGENCE) { el.innerHTML = '<div class="stat"><span>unavailable</span></div>'; return; }
    const bs = DIVERGENCE.quadrants.blind_spot || { tracts: 0, population: 0, over_65: 0 };
    el.innerHTML =
      '<div class="stat"><span>Exposure vs vulnerability</span><b>r = ' + DIVERGENCE.correlation_gap_vs_svi + '</b></div>' +
      '<div class="stat"><span><b>Missed by the index</b></span><b>' + bs.tracts + ' of ' + DIVERGENCE.severe_tracts + ' hot tracts</b></div>' +
      '<div class="stat"><span>People in them</span><b>' + bs.population.toLocaleString() + '</b></div>' +
      '<div class="stat"><span>Aged 65+ in them</span><b>' + bs.over_65.toLocaleString() + '</b></div>';
    note.textContent = 'Measured overnight exposure and CDC social vulnerability are uncorrelated ' +
      'in this study area, so neither substitutes for the other. Red tracts are severely exposed ' +
      'but fall outside the top-quartile band a programme would target. That count depends on ' +
      'where the line is drawn: 15 tracts at SVI 0.75, 4 at SVI 0.50.';
  }
}

const SUGGESTIONS = [
  'Where is the city not looking?',
  'How solid is that number?',
  'Which missed tracts have the most people over 65?',
  'Would cool pavement help tract 1085.02?',
];

function renderChips() {
  const box = document.getElementById('chips');
  box.innerHTML = '';
  SUGGESTIONS.forEach(function (t) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = t;
    b.addEventListener('click', function () {
      document.getElementById('q').value = t;
      ask();
    });
    box.appendChild(b);
  });
}

async function ask() {
  const input = document.getElementById('q');
  const btn = document.getElementById('ask');
  const out = document.getElementById('answer');
  const trail = document.getElementById('trail');
  const question = input.value.trim();
  if (!question) return;

  btn.disabled = true;
  out.textContent = 'Thinking. The agent reads the measurements before answering.';
  trail.hidden = true;

  try {
    const res = await fetch('/api/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question })
    });
    const body = await res.json();
    if (!res.ok) {
      out.textContent = body.detail || ('Request failed with status ' + res.status);
      return;
    }
    out.textContent = body.answer || '(no answer)';
    const calls = (body.audit_trail || []).map(function (s) {
      return (s.ok ? '' : 'FAILED ') + s.tool +
             (Object.keys(s.args || {}).length ? ' ' + JSON.stringify(s.args) : '');
    });
    trail.innerHTML = '<b>Read ' + calls.length + ' source' + (calls.length === 1 ? '' : 's') +
      (body.consulted_limits ? ', including the stated limits' : '') + ':</b><br>' +
      calls.join('<br>');
    trail.hidden = calls.length === 0;
  } catch (e) {
    out.textContent = 'Could not reach the agent: ' + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
  }
}

async function renderPanel() {
  try {
    const both = await Promise.all([
      fetch('/api/summary').then(r => r.json()),
      fetch('/api/divergence').then(r => r.json())
    ]);
    SUMMARY = both[0]; DIVERGENCE = both[1];
  } catch (e) {
    warn('Could not load summary data: ' + (e && e.message ? e.message : e));
  }
  renderStats();
  renderLegend();
}

// ---- 2. Map on a blank style, so it reaches 'load' with no network at all. ----
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#e8eef1' } }]
  },
  center: [-112.077, 33.494],
  zoom: 10.4,
  attributionControl: false
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

async function renderTracts() {
  const gj = await fetch('/api/tracts').then(r => r.json());
  map.addSource('tracts', { type: 'geojson', data: gj });
  map.addLayer({
    id: 'fill', type: 'fill', source: 'tracts',
    paint: { 'fill-color': colorExpr(), 'fill-opacity': 0.8 }
  });
  map.addLayer({
    id: 'line', type: 'line', source: 'tracts',
    paint: { 'line-color': '#0e2129', 'line-width': 0.4, 'line-opacity': 0.45 }
  });

  const popup = new maplibregl.Popup({ closeButton: false, offset: 8 });
  map.on('mousemove', 'fill', e => {
    const p = e.features[0].properties;
    map.getCanvas().style.cursor = 'pointer';
    popup.setLngLat(e.lngLat).setHTML(
      `<b>Tract ${p.name}</b>
       ${Number(p.value).toFixed(2)} h above threshold<br>
       ${p.svi != null ? 'SVI ' + Number(p.svi).toFixed(2) + ' pctile<br>' : ''}${p.population ? Number(p.population).toLocaleString() + ' people, ' + Number(p.over_65).toLocaleString() + ' aged 65+<br>' : ''}<span style="color:#64808c">${(p.coverage * 100).toFixed(0)}% measured · ${p.n_tiles} tiles</span>`
    ).addTo(map);
  });
  map.on('mouseleave', 'fill', () => {
    map.getCanvas().style.cursor = '';
    popup.remove();
  });
  return gj.features.length;
}

// ---- 3. Basemap is a best-effort enhancement, added underneath and allowed to fail. ----
function tryBasemap() {
  try {
    map.addSource('osm', {
      type: 'raster',
      tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256,
      attribution: '© OpenStreetMap contributors'
    });
    map.addLayer({ id: 'osm', type: 'raster', source: 'osm',
                   paint: { 'raster-opacity': 0.5 } }, 'fill');
  } catch (e) {
    warn('Basemap unavailable. Tract data is unaffected.');
  }
}

renderPanel();

// Gate on style parse, not on first paint. `map.on('load')` waits for a render,
// which never happens if the tab is backgrounded or throttled -- the data would
// then silently never appear. `styledata` fires as soon as the style is usable.
//
// Both hooks can fire, so boot must be single-flight. A plain `if (ready) return`
// guard does not work: the flag is only set *after* an await, so a second call
// slips past it, re-runs addSource('tracts'), and throws "source already exists"
// -- which surfaced as a bogus "could not load" banner over a perfectly good map.
// Latching the promise synchronously is what actually makes it idempotent.
let bootPromise = null;

async function doBoot() {
  try {
    window.__tracts = await renderTracts();
  } catch (e) {
    console.error('renderTracts failed:', e);
    warn('Tract data unavailable: ' + (e && e.message ? e.message : e));
    return;
  }
  tryBasemap();
  applyView();
  window.__ready = true;
}

function boot() {
  if (!bootPromise) bootPromise = doBoot();
  return bootPromise;
}

document.getElementById('ask').addEventListener('click', ask);
document.getElementById('q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') ask();
});
renderChips();

document.querySelectorAll('.tab').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b === btn); });
    VIEW = btn.dataset.view;
    applyView();
  });
});

if (map.isStyleLoaded()) boot();
else map.once('styledata', boot);
map.on('load', boot);
</script>
</body>
</html>
